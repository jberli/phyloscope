    cartography:
      - type: title
        en: Using the map
        fr: Utilisation de la carte
      - type: buttons
        content:
          - type: standard
            text:
              en: Natural Earth 1
              fr: Natural Earth 1
            label:
              en: Change the basemap
              fr: Changer le fond de carte
          - type: standard
